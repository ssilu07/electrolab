name: Build & Deploy to Google Play Store

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      user_fraction:
        description: 'Rollout fraction (1.0 = 100%, 0.1 = 10%)'
        required: false
        default: '1.0'

concurrency:
  group: playstore-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Publish Release Bundle
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_CONFIG: ${{ secrets.PLAY_CONFIG_JSON }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Determine Version Code & Name
        id: versioning
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          BASE_OFFSET=10
          CALC_VERSION_CODE=$((BASE_OFFSET + GITHUB_RUN_NUMBER))
          echo "Calculated Version Code: $CALC_VERSION_CODE"
          echo "Version Name (from package.json): $PACKAGE_VERSION"
          echo "VERSION_CODE=$CALC_VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Determine Target Play Track
        id: target_track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ github.event.inputs.track }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TRACK="production"
          else
            TRACK="internal"
          fi
          echo "Target Play Store Track: $TRACK"
          echo "PLAY_TRACK=$TRACK" >> $GITHUB_ENV

      - name: Decode Release Keystore
        id: decode_keystore
        run: |
          python3 scripts/decode_keystore.py
          if [ -s android/app/release.jks ]; then
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          chmod +x ./gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Building and signing release bundle with native Gradle signing..."
            TARGET_ALIAS="${{ secrets.KEY_ALIAS }}"
            if [ -z "$TARGET_ALIAS" ]; then
              TARGET_ALIAS="${ACTUAL_KEY_ALIAS:-key0}"
            fi
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            if [ -z "$KEY_PASS" ]; then
              KEY_PASS="$STORE_PASS"
            fi
            echo "Using Key Alias: $TARGET_ALIAS"

            ./gradlew bundleRelease \
              -PversionCode=${{ env.VERSION_CODE }} \
              -PversionName=${{ env.VERSION_NAME }} \
              -PRELEASE_STORE_FILE=release.jks \
              -PRELEASE_STORE_PASSWORD="$STORE_PASS" \
              -PRELEASE_KEY_ALIAS="$TARGET_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASS"
          else
            echo "Building unsigned release bundle..."
            ./gradlew bundleRelease \
              -PversionCode=${{ env.VERSION_CODE }} \
              -PversionName=${{ env.VERSION_NAME }}
          fi

      - name: Upload Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: ElectroLab-v${{ env.VERSION_NAME }}-build-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Deploy Directly to Google Play Store
        if: env.PLAY_CONFIG != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.royals.electolab
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ github.event.inputs.status || 'completed' }}
          userFraction: ${{ github.event.inputs.user_fraction || '1.0' }}
          whatsNewDirectory: android/app/src/main/play/release-notes
